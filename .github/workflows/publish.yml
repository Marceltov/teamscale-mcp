# Build the Docker image and push it to the GitHub Container Registry (ghcr.io).
# Mirrors .gitlab-ci.yml (multi-arch, sha + latest + semver tags) but targets
# ghcr. Auth uses the built-in GITHUB_TOKEN — no secrets to configure.
name: Publish image

on:
  push:
    branches: [main]
    # Docs-only changes don't affect the image, so skip the (multi-arch) build.
    # A push that also touches any non-doc file still builds. `v*` tags and manual
    # runs always build regardless of paths.
    paths-ignore:
      - "**.md"
      - "docs/**"
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Derived from the repository, not hardcoded: a GitHub account/org rename
      # (as happened marcelbruckner -> marceltov) silently breaks a hardcoded
      # namespace with a permission_denied push failure, since the old owner
      # no longer has an app installation for this repo.
      - name: Set lowercase image name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
